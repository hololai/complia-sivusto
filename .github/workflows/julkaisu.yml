# Rakentaa sivuston ja julkaisee sen GitHub Pagesiin jokaisesta mainiin tulevasta pushista.
# Tarkistin ajetaan ensin: jos se löytää virheen, mitään ei julkaista.
name: Julkaisu

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  rakenna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Tarkista sivusto
        run: npm run tarkista -- --pages
      # Sivusto toimii omassa osoitteessaan complia.fi, joten alipolkua ei tarvita.
      - name: Rakenna
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  julkaise:
    needs: rakenna
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.julkaisu.outputs.page_url }}
    steps:
      - id: julkaisu
        uses: actions/deploy-pages@v4
